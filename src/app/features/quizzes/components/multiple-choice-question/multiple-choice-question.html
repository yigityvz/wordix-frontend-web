<!-- Backend optionlarını erişilebilir tek seçim listesi olarak render eder. -->
<div class="space-y-3" role="radiogroup" aria-label="Answer options">
  @for (option of options(); track option.quizOptionId) {
    <button type="button" role="radio" class="flex min-h-14 w-full items-center gap-3 rounded-2xl border p-4 text-left transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-wx-focus disabled:cursor-not-allowed disabled:opacity-60" [class.border-wx-accent]="selectedOptionId() === option.quizOptionId" [class.bg-wx-surface-muted]="selectedOptionId() === option.quizOptionId" [class.border-wx-border]="selectedOptionId() !== option.quizOptionId" [attr.aria-checked]="selectedOptionId() === option.quizOptionId" [disabled]="disabled()" (click)="selectOption(option.quizOptionId)">
      <span class="flex size-8 shrink-0 items-center justify-center rounded-lg bg-wx-surface text-sm font-black text-wx-accent">{{ option.displayOrder }}</span>
      <span class="font-semibold text-wx-text">{{ option.optionText }}</span>
    </button>
  }
</div>
<div class="mt-6 flex justify-end"><wx-button size="lg" [loading]="loading()" [disabled]="disabled() || !selectedOptionId()" (activated)="submitAnswer()">Submit answer</wx-button></div>
