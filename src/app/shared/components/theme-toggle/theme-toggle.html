<!-- Compact Tailwind theme control cycles through all three supported modes. -->
<button
  type="button"
  class="flex size-10 items-center justify-center rounded-xl border border-wx-border bg-wx-surface-muted text-wx-text-secondary shadow-sm transition-all hover:scale-105 hover:bg-wx-surface hover:text-wx-text active:scale-95"
  [attr.aria-label]="accessibleLabel()"
  [attr.title]="accessibleLabel()"
  (click)="selectNextTheme()"
>
  @switch (displayTheme()) {
    @case ('dark') {
      <!-- Dark view offers the sun icon as the next visual action. -->
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.9"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"
        />
      </svg>
    }
    @case ('light') {
      <!-- Light view offers the moon icon as the next visual action. -->
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.9"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.6 6.6 0 0 0 21 12.8Z" />
      </svg>
    }
    @default {
      <!-- System preference uses a monitor icon to show device synchronization. -->
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.9"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect x="3" y="4" width="18" height="13" rx="2" />
        <path d="M8 21h8M12 17v4" />
      </svg>
    }
  }
</button>
