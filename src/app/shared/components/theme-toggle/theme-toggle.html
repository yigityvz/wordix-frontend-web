<!-- Accessible three-way theme selector rendered as a radio group. -->
<div
  class="inline-flex rounded-xl border border-wx-border bg-wx-surface-muted p-1 shadow-sm"
  role="radiogroup"
  aria-label="Color theme"
>
  @for (option of options; track option.value) {
    <button
      type="button"
      role="radio"
      class="min-h-9 rounded-lg px-3 text-sm font-medium text-wx-text-secondary transition-colors hover:bg-wx-surface hover:text-wx-text disabled:cursor-not-allowed disabled:opacity-50"
      [class.bg-wx-surface]="theme() === option.value"
      [class.text-wx-text]="theme() === option.value"
      [class.shadow-sm]="theme() === option.value"
      [attr.aria-checked]="theme() === option.value"
      (click)="selectTheme(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
