<!-- Variant, size, loading ve disabled davranışlarını tek native button üzerinde birleştirir. -->
<button
  class="inline-flex items-center justify-center gap-2 border font-semibold shadow-sm transition active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-50"
  [class]="variantClasses() + ' ' + sizeClasses()"
  [type]="type()"
  [disabled]="isDisabled()"
  [attr.aria-busy]="loading()"
  (click)="handleClick($event)"
>
  <!-- Async işlem boyunca tekrar submit yerine erişilebilir spinner gösterilir. -->
  @if (loading()) {
    <span
      class="size-4 animate-spin rounded-full border-2 border-current border-t-transparent"
      aria-hidden="true"
    ></span>
  }

  <!-- Parent tarafından verilen generic buton içeriği burada render edilir. -->
  <ng-content />
</button>
