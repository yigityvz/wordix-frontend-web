<!-- Mobil ekranlarda owning shell'in verdiği route'ları dokunmatik kullanıma uygun alt navigation olarak gösterir. -->
<nav
  class="fixed inset-x-0 bottom-0 z-30 grid min-h-16 border-t border-wx-border bg-wx-surface/95 px-2 pb-[env(safe-area-inset-bottom)] backdrop-blur-xl md:hidden"
  [style.grid-template-columns]="'repeat(' + visibleItems().length + ', minmax(0, 1fr))'"
  aria-label="Mobile navigation"
>
  <!-- Computed signal tarafından en fazla beşe indirilen route'lar benzersiz path ile render edilir. -->
  @for (item of visibleItems(); track item.route) {
    <a
      class="flex min-h-16 flex-col items-center justify-center gap-1 rounded-xl px-1 text-[11px] font-semibold text-wx-text-muted transition-colors hover:bg-wx-surface-muted hover:text-wx-text"
      [routerLink]="item.route"
      routerLinkActive="text-wx-accent"
      [routerLinkActiveOptions]="{ exact: false }"
    >
      <!-- Kısa etiket küçük ekranda tanınabilir bir görsel işaret sağlar. -->
      <span
        class="flex size-6 items-center justify-center rounded-lg border border-current/20 text-[9px] font-bold uppercase"
        aria-hidden="true"
      >
        {{ item.shortLabel }}
      </span>
      <!-- Uzun route etiketi layoutu bozmadan tek satırda kısaltılır. -->
      <span class="max-w-full truncate">{{ item.label }}</span>
    </a>
  }
</nav>
