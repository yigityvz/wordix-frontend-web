<!-- Navigation amacını dekoratif ve tutarlı stroke tabanlı SVG ile gösterir. -->
<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.9"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  @switch (name()) {
    @case ('dashboard') {
      <rect x="3" y="3" width="7" height="7" rx="1.5" />
      <rect x="14" y="3" width="7" height="7" rx="1.5" />
      <rect x="3" y="14" width="7" height="7" rx="1.5" />
      <rect x="14" y="14" width="7" height="7" rx="1.5" />
    }
    @case ('search') {
      <circle cx="11" cy="11" r="7" />
      <path d="m20 20-4-4" />
    }
    @case ('dictionary') {
      <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v17H6.5A2.5 2.5 0 0 0 4 22z" />
      <path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v17h4.5A2.5 2.5 0 0 1 20 22z" />
    }
    @case ('decks') {
      <path d="m12 3 9 5-9 5-9-5z" />
      <path d="m3 12 9 5 9-5" />
      <path d="m3 16 9 5 9-5" />
    }
    @case ('quiz') {
      <path d="M4 5h16" />
      <path d="M6 5v4a6 6 0 0 0 12 0V5" />
      <path d="M12 15v6" />
      <path d="M8 21h8" />
    }
    @case ('statistics') {
      <path d="M4 20V10" />
      <path d="M10 20V4" />
      <path d="M16 20v-7" />
      <path d="M22 20H2" />
    }
    @case ('settings') {
      <circle cx="12" cy="12" r="3" />
      <path
        d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.17.38.38.72.6 1 .29.36.67.58 1.1.6H21v4h-.09a1.7 1.7 0 0 0-1.51.4Z"
      />
    }
    @case ('trending') {
      <path d="m3 17 6-6 4 4 8-8" />
      <path d="M15 7h6v6" />
    }
    @case ('saved') {
      <path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z" />
    }
    @case ('wrong') {
      <path
        d="M9.2 4.5A3.8 3.8 0 0 1 12 3a3.8 3.8 0 0 1 2.8 1.5A3.8 3.8 0 0 1 18 8a4 4 0 0 1-1 2.6A4 4 0 0 1 15 18H9a4 4 0 0 1-2-7.4A4 4 0 0 1 6 8a3.8 3.8 0 0 1 3.2-3.5Z"
      />
      <path d="m9 10 6 6" />
      <path d="m15 10-6 6" />
    }
    @case ('provider') {
      <path d="M17.5 19H7a5 5 0 1 1 1.2-9.85A6 6 0 0 1 19.7 11 4 4 0 0 1 17.5 19Z" />
      <path d="M12 12v6" />
      <path d="m9.5 14.5 2.5-2.5 2.5 2.5" />
    }
  }
</svg>
