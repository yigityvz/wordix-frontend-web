<!-- Business sayfalarının responsive navigation ile ortak bir frame içinde render edilmesini sağlar. -->
<div class="flex min-h-screen bg-wx-background text-wx-text">
  <!-- Masaüstü navigation shell sahibinin verdiği route listesini kullanır. -->
  <wx-sidebar [items]="navigationItems()" />

  <!-- Navbar ve routed içeriği kalan yatay alanı dolduran ana kolonda toplar. -->
  <div class="flex min-w-0 flex-1 flex-col">
    <!-- Sayfa bağlamı ve tema kontrolü sticky navbar üzerinde sunulur. -->
    <wx-navbar [pageTitle]="pageTitle()" />

    <!-- Feature sayfaları yalnızca bu kaydırılabilir ve genişliği sınırlı alanda açılır. -->
    <main class="flex-1 overflow-y-auto px-4 py-5 pb-24 md:px-6 md:py-6 md:pb-6">
      <div class="mx-auto w-full max-w-7xl">
        <!-- Child route tarafından seçilen gerçek feature componentini render eder. -->
        <router-outlet />
      </div>
    </main>
  </div>

  <!-- Aynı izinli route listesinin mobil için sınırlı alt navigation karşılığıdır. -->
  <wx-mobile-nav [items]="navigationItems()" />
</div>
